# Minimal ircu2 config for pybot integration tests.
# Not for production.

General {
  name = "pybot.test.net";
  vhost = "0.0.0.0";
  description = "pybot ircu2 test harness";
  numeric = 1;
};

Admin {
  Location = "pybot";
  Location = "test harness";
  Contact = "pybot@localhost";
};

Class {
  name = "Local";
  pingfreq = 1 minutes 30 seconds;
  sendq = 160000;
  maxlinks = 200;
};

Client {
  ip = "*";
  class = "Local";
  maxlinks = 200;
};

Operator {
  local = no;
  class = "Local";
  host = "*@*";
  password = "$PLAIN$operpass";
  name = "testoper";
  set = yes;
};

Port { port = 6667; };

Features {
  "HUB" = "TRUE";
  "NODNS" = "TRUE";
  "CONFIG_OPERCMDS" = "TRUE";
  "CHANNELLEN" = "50";
  "MAXCHANNELSPERUSER" = "20";
  "IPCHECK_CLONE_LIMIT" = "1000";
  "IPCHECK_CLONE_PERIOD" = "1";
  "PINGFREQUENCY" = "90";
  "HOST_HIDING" = "FALSE";
  # Keep connection/join throttles loose for parallel fake clients
  "CONNECTTIMEOUT" = "30";
};
